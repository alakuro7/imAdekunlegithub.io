<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="JavaScript" href="script.js" />
</head>
<body>
  <main class="profile-card" data-testid="profile-card">
    <header class="profile-header" data-testid="profile-header">
      <img 
        src="./Adekunle.jpg" 
        alt="Profile photo of Adekunle Alakuro" 
        class="profile-image"
        data-testid="profile-image"
      />
      <h1 class="profile-name" data-testid="profile-name">Adekunle Alakuro</h1>
      <p class="profile-title" data-testid="profile-title">Frontend Developer</p>
    </header>

    <section class="profile-details" data-testid="profile-details">
      <p class="profile-bio" data-testid="profile-bio">
        Passionate about creating intuitive and accessible user experiences. Loves working with JavaScript, CSS, and design systems.
      </p>
      <ul class="profile-links" data-testid="profile-links">
        <li><a href="#" target="_blank" data-testid="twitter-link">Twitter</a></li>
        <li><a href="#" target="_blank" data-testid="github-link">GitHub</a></li>
        <li><a href="#" target="_blank" data-testid="linkedin-link">LinkedIn</a></li>
      </ul>
    </section>

    <footer class="profile-footer" data-testid="profile-footer">
      <button id="toggle-info" data-testid="toggle-button">Hide Bio</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
